# Production profile for Docker container with SQL Server

# Server configuration
server.port=@server.port@

# SQL Server Database Configuration
spring.datasource.url=@spring.datasource.url@
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=@spring.datasource.username@
spring.datasource.password=@spring.datasource.password@

# JPA configuration for SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=@spring.jpa.hibernate.ddl-auto@
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Connection pool configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging
logging.level.com.example=INFO
logging.level.org.springframework.web=DEBUG

# Hikari connection pool settings for better Docker compatibility
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
