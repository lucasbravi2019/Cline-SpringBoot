# Docker Compose file for Spring Boot app with SQL Server

services:
  # SQL Server container
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-container
    env_file:
      - sqlserver.env
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./sql-scripts:/scripts
    networks:
      - springapp-network
    # Health check using /opt/mssql/bin/sqlservr availability
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "ps aux | grep sqlservr | grep -v grep"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SQL Server initialization service
  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    env_file:
      - sqlserver.env
    networks:
      - springapp-network
    volumes:
      - ./sql-scripts:/scripts
    entrypoint: >
      /bin/bash -c "
      until /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"\$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' >/dev/null 2>&1;
      do
        echo 'Waiting for SQL Server...';
        sleep 5;
      done;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"\$$MSSQL_SA_PASSWORD\" -C -i /scripts/init.sql
      "
    restart: "no"

  # Spring Boot application container
  springapp:
    build: .
    container_name: springapp-container
    depends_on:
      sqlserver:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - springapp-network

volumes:
  sqlserver_data:

networks:
  springapp-network:
    driver: bridge
